name: Worker checks and Cloudflare deploy

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "js/**"
      - "index.html"
      - "404.html"
      - "css/**"
      - "scripts/**"
      - "wrangler.jsonc"
      - ".github/workflows/worker-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/worker-check.yml"
  workflow_dispatch:

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker tooling
        run: |
          npm init -y
          npm install --no-save wrangler@4.162.0 typescript@5.7.3
      - name: Generate Cloudflare binding types
        working-directory: server
        run: npx wrangler types
      - name: Type-check Worker
        working-directory: server
        run: npx tsc -p tsconfig.json
      - name: Check frontend syntax and encryption
        run: node scripts/check-frontend.mjs
      - name: Validate family D1 schema
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          db.execute("PRAGMA foreign_keys = ON")
          db.execute("CREATE TABLE users (user_id TEXT PRIMARY KEY)")
          db.executescript(Path("server/family-schema.sql").read_text())
          expected = {
              "cloud_families",
              "cloud_family_members",
              "cloud_family_vaults",
              "cloud_family_member_vaults",
          }
          actual = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          missing = expected - actual
          if missing:
              raise SystemExit("Missing tables: " + ", ".join(sorted(missing)))
          print("Family schema is valid.")
          PY

  deploy:
    name: Deploy and verify live Gullak on Cloudflare
    runs-on: ubuntu-latest
    needs: worker
    if: github.event_name != 'pull_request'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --no-save wrangler@4.162.0
      - name: Check Cloudflare credentials
        id: credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error::Cloudflare deployment secrets are missing. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Apply family D1 schema and deploy cloud API Worker
        if: steps.credentials.outputs.available == 'true'
        working-directory: server
        run: |
          npx wrangler d1 execute gullak-db --remote --file=schema.sql --yes --config=wrangler.jsonc
          npx wrangler d1 execute gullak-db --remote --file=family-schema.sql --yes --config=wrangler.jsonc
          npx wrangler deploy --config=wrangler.jsonc
      - name: Build and deploy latest static frontend Worker
        if: steps.credentials.outputs.available == 'true'
        working-directory: .
        run: |
          rm -rf public
          mkdir -p public
          cp index.html 404.html public/
          cp -R css js public/
          npx wrangler deploy --config=wrangler.jsonc


      - name: Verify deployed frontend and cloud API
        if: steps.credentials.outputs.available == 'true'
        env:
          APP_URL: https://gullak-piggybank.ahansantra607.workers.dev
          API_URL: https://server.ahansantra607.workers.dev
        run: node scripts/smoke-live.mjs

      - name: Capture Cloud API logs if live verification fails
        if: failure()
        working-directory: .
        run: |
          timeout 18s npx wrangler tail server --config=server/wrangler.jsonc --format=json > /tmp/gullak-worker-tail.log 2>&1 &
          TAIL_PID=$!
          sleep 3
          node scripts/smoke-live.mjs || true
          sleep 2
          kill $TAIL_PID 2>/dev/null || true
          wait $TAIL_PID 2>/dev/null || true
          cat /tmp/gullak-worker-tail.log
