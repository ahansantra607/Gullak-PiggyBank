name: Build and publish Gullak Android APK

on:
  push:
    paths:
      - '.github/release-v1.1.1'
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (patch update: 1.1.1)"
        required: true
        type: string
      release_notes:
        description: "What is new in this update (leave blank to use Bug fixes)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: gullak-android-release
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || 'main' }}
      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || (github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version)) || 'v1.1.1' }}
        run: |
          version="${RELEASE_TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a version tag like v1.0.0"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Prepare release description
        id: notes
        env:
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          notes="${RELEASE_NOTES:-}"
          if [ "$EVENT_NAME" = "push" ] && [ -f .github/release-v1.1.1 ]; then
            notes="$(cat .github/release-v1.1.1)"
          fi
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            notes="Bug fixes"
          fi
          {
            echo 'body<<GULLAK_RELEASE_NOTES'
            printf '%s\n' "$notes"
            echo 'GULLAK_RELEASE_NOTES'
          } >> "$GITHUB_OUTPUT"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$sdkmanager_path" ]; then
            echo "::error::Android SDK command-line tools were not found on the GitHub runner."
            exit 1
          fi
          set +o pipefail
          yes | "$sdkmanager_path" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager_path" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Decrypt permanent signing key
        env:
          KEY_ENCRYPTION_PASSWORD: ${{ secrets.ANDROID_KEY_ENCRYPTION_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEY_ENCRYPTION_PASSWORD" ]; then
            echo "::error::Missing ANDROID_KEY_ENCRYPTION_PASSWORD. Complete the signing setup first."
            exit 1
          fi
          if [ ! -f android/signing/gullak-signing.zip.gpg ]; then
            echo "::error::Encrypted signing bundle not found. Run the signing setup workflow on main first."
            exit 1
          fi
          gpg --batch --yes --pinentry-mode loopback --passphrase "$KEY_ENCRYPTION_PASSWORD" \
            --decrypt android/signing/gullak-signing.zip.gpg > /tmp/gullak-signing.zip
          mkdir -p android/signing
          unzip -oq /tmp/gullak-signing.zip -d android/signing
          rm -f /tmp/gullak-signing.zip
      - name: Build signed universal APK
        env:
          GULLAK_VERSION: ${{ steps.version.outputs.value }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          gradle --no-daemon verifyReleaseSigning assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Gullak.apk
      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: main
          files: Gullak.apk
          body: ${{ steps.notes.outputs.body }}
          name: Gullak v${{ steps.version.outputs.value }}
          fail_on_unmatched_files: true
          make_latest: true
