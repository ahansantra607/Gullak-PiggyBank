<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7B3FE4">
  <title>Gullak · Update</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://gullak-piggybank.ahansantra607.workers.dev/css/style.css">
</head>
<body>
  <div id="app">
    <main class="view ob center">
      <div class="welcome">
        <div class="hero"><svg class="piggy huge" width="200" height="170" viewBox="0 0 200 170" role="img" aria-label="Gullak the piggy bank">
          <path d="M168,98 q20,-6 14,-20 q-6,-10 -14,0" stroke="#FF7BAC" stroke-width="5" fill="none" stroke-linecap="round"/>
          <path d="M54,138 h20 v17 q0,7 -7,7 h-6 q-7,0 -7,-7 Z M126,138 h20 v17 q0,7 -7,7 h-6 q-7,0 -7,-7 Z" fill="#FF86B5"/>
          <path d="M52,66 L58,34 L84,54 Z M148,66 L142,34 L116,54 Z" fill="#FF86B5"/>
          <path d="M100,44 C141,44 174,67 174,102 C174,137 143,160 100,160 C57,160 26,137 26,102 C26,67 59,44 100,44 Z" fill="#FFA3C8"/>
          <path d="M54,76 C60,61 91,60 106,70 C96,84 70,86 54,76 Z" fill="#FFC4DC" fill-opacity=".6"/>
          <path d="M84,46 h32 v7 h-32 Z" fill="#A3245B"/>
          <circle cx="74" cy="84.5" r="5.5" fill="#3A2140"/><circle cx="126" cy="84.5" r="5.5" fill="#3A2140"/>
          <circle cx="58" cy="103" r="9" fill="#FF6F9F" fill-opacity=".45"/><circle cx="142" cy="103" r="9" fill="#FF6F9F" fill-opacity=".45"/>
          <path d="M100,99 C112,99 122,105 122,114 C122,123 112,129 100,129 C88,129 78,123 78,114 C78,105 88,99 100,99 Z" fill="#FF7BAC"/>
          <ellipse cx="92" cy="108" rx="4" ry="6" fill="#A3245B"/><ellipse cx="108" cy="108" rx="4" ry="6" fill="#A3245B"/>
          <path d="M90,135 q10,7 20,0" stroke="#A3245B" stroke-width="4.5" fill="none" stroke-linecap="round"/>
        </svg></div>
        <div class="brand">Gullak</div>
        <p class="tag">Your money buddy</p>
      </div>
      <section class="card">
        <div class="small muted">A new version is ready</div>
        <h1>Time for an update!</h1>
        <p class="muted">A better, smoother Gullak is waiting for you.</p>
        <div class="banner info left">
          <b>What's new</b>
          <p id="release-notes">The latest improvements and fixes are ready.</p>
          <p class="small"><b>Version <span id="version">1.1.0</span></b></p>
        </div>
        <button class="btn primary block big" id="update">Update Gullak</button>
        <button class="btn ghost block" id="later">Maybe later</button>
        <p class="fine" id="message" aria-live="polite"></p>
      </section>
    </main>
  </div>
  <script>
    (function () {
      const $ = id => document.getElementById(id);
      window.initGullakUpdate = function (version, notes) {
        $('version').textContent = version;
        $('release-notes').textContent = notes || 'Bug fixes and improvements.';
      };
      $('update').addEventListener('click', () => {
        if (window.GullakNative && window.GullakNative.installUpdate) window.GullakNative.installUpdate();
        else $('message').textContent = 'Updates can only be installed from the Gullak Android app.';
      });
      $('later').addEventListener('click', () => {
        if (window.GullakNative && window.GullakNative.dismissUpdate) window.GullakNative.dismissUpdate();
        else $('message').textContent = 'You can update Gullak later from the Android app.';
      });
    })();
  </script>
</body>
</html>
