<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7B3FE4">
  <title>Gullak · Phone PIN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://gullak-piggybank.ahansantra607.workers.dev/css/style.css">
</head>
<body>
  <div id="app">
    <main class="view ob">
      <div class="welcome">
        <div class="hero"><div class="piggy huge" aria-hidden="true">🐷</div></div>
        <div class="brand">Gullak</div>
        <p class="tag">Your money buddy</p>
      </div>
      <section class="card center">
        <div class="small muted" id="eyebrow">ONE-TIME SETUP</div>
        <h1 id="heading">Create your phone PIN</h1>
        <p class="muted small" id="description">Choose a six-digit PIN. You can use the same PIN on every phone signed in to this Gullak account.</p>
        <label class="label" for="pin" id="pin-label">Your six-digit PIN</label>
        <input class="input big" id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="6" pattern="[0-9]{6}" placeholder="••••••">
        <p class="hint" id="hint" aria-live="polite">You’ll enter it again to confirm.</p>
        <button class="btn primary block big" id="continue">Continue</button>
        <button class="btn ghost block" id="logout" hidden>Log out of Gullak</button>
      </section>
    </main>
  </div>
  <script>
    (function () {
      const $ = id => document.getElementById(id);
      let mode = 'setup', firstPin = '', confirming = false, busy = false;
      function showSetup() {
        mode = 'setup'; firstPin = ''; confirming = false;
        $('eyebrow').textContent = 'ONE-TIME SETUP';
        $('heading').textContent = 'Create your phone PIN';
        $('description').textContent = 'Choose a six-digit PIN. You can use the same PIN on every phone signed in to this Gullak account.';
        $('pin-label').textContent = 'Your six-digit PIN';
        $('hint').textContent = 'You’ll enter it again to confirm.';
        $('continue').hidden = false; $('continue').disabled = false; $('continue').textContent = 'Continue';
        $('logout').hidden = true; $('pin').value = '';
      }
      function showUnlock() {
        mode = 'unlock'; firstPin = ''; confirming = false;
        $('eyebrow').textContent = 'WELCOME BACK';
        $('heading').textContent = 'Unlock your Gullak';
        $('description').textContent = 'Enter your six-digit phone PIN to continue.';
        $('pin-label').textContent = 'Your phone PIN';
        $('hint').textContent = 'Your account stays signed in until you log out.';
        $('continue').hidden = false; $('continue').disabled = false; $('continue').textContent = 'Unlock Gullak';
        $('logout').hidden = false; $('pin').value = '';
      }
      window.initGullakPin = screenMode => screenMode === 'unlock' ? showUnlock() : showSetup();
      window.showGullakPinError = message => {
        busy = false; $('continue').disabled = false;
        $('hint').textContent = message || 'That did not work. Please try again.';
        $('pin').value = ''; $('pin').focus();
      };
      $('continue').addEventListener('click', () => {
        if (busy) return;
        const value = $('pin').value;
        if (!/^\d{6}$/.test(value)) { $('hint').textContent = 'Please enter all six digits.'; return; }
        if (mode === 'setup' && !confirming) {
          firstPin = value; confirming = true; $('pin').value = '';
          $('eyebrow').textContent = 'CONFIRM YOUR PIN';
          $('heading').textContent = 'Enter it one more time';
          $('description').textContent = 'Type the same six digits again to make sure they are correct.';
          $('hint').textContent = 'Your PIN will be shared across phones on this account.';
          $('continue').textContent = 'Set my PIN'; return;
        }
        if (mode === 'setup' && value !== firstPin) {
          showSetup(); $('hint').textContent = 'Those PINs did not match. Please create your PIN again.'; return;
        }
        busy = true; $('continue').disabled = true;
        $('hint').textContent = mode === 'setup' ? 'Securing your phone PIN…' : 'Checking your PIN…';
        const bridge = window.GullakNative;
        if (mode === 'setup' && bridge && bridge.setupPhonePin) bridge.setupPhonePin(value);
        else if (mode === 'unlock' && bridge && bridge.verifyPhonePin) bridge.verifyPhonePin(value);
        else window.showGullakPinError('Phone PIN is available only in the Gullak Android app.');
      });
      $('logout').addEventListener('click', () => {
        if (window.GullakNative && window.GullakNative.logoutFromPin) window.GullakNative.logoutFromPin();
        else $('hint').textContent = 'Log out is available in the Gullak Android app.';
      });
      $('pin').addEventListener('input', () => { $('pin').value = $('pin').value.replace(/\D/g, '').slice(0, 6); });
    })();
  </script>
</body>
</html>
